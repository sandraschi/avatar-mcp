[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "avatarmcp"
version = "0.1.0"
description = "MCP server for managing and animating VRM avatars"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastmcp>=2.10.0",
    "numpy>=1.21.0",
    "pyvista>=0.35.0",
    "trimesh>=3.9.0",
    "pygltflib>=1.14.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "black>=21.12b0",
    "isort>=5.10.1",
    "mypy>=0.910",
    "pylint>=2.12.0"
]
fractals = [
    "matplotlib>=3.5.0",
    "pillow>=9.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["avatarmcp*"]
