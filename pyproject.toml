[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "avatarmcp"
version = "0.4.1"
description = "MCP server for managing and animating VRM avatars"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "AvatarMCP Team", email = "dev@avatarmcp.example.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
    "fastmcp>=3.4.4,<4",
    "numpy>=1.21.0",
    "python-osc>=1.8.2",
    "pygltflib>=1.14.0",
    "trimesh>=3.9.0",
    "packaging>=21.0",
    "fastapi>=0.132.0",
    "uvicorn[standard]>=0.38.0",
    "sounddevice>=0.4.4",
    "prometheus-client>=0.17.1",
    "aiofiles>=23.1.0",
    "httpx>=0.27.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.16.0,<0.17",
    "mypy>=1.0.0",
    "pylint>=2.15.0",
    "types-setuptools",
    "bandit>=1.7.0",
    "pyvista>=0.35.0",
    "prefab-ui>=0.14.0",
]

# No [project.scripts] - avoids avatarmcp.exe in .venv so uv sync never locks (run via: uv run python -m avatarmcp)

[project.entry-points.'mcp.server']
avatarmcp = "avatarmcp.server:AvatarMCPServer"

[project.urls]
Homepage = "https://github.com/yourusername/avatarmcp"
Documentation = "https://github.com/yourusername/avatarmcp#readme"
Issues = "https://github.com/yourusername/avatarmcp/issues"
Source = "https://github.com/yourusername/avatarmcp"

[tool.setuptools.packages.find]
where = ["src"]
include = ["avatarmcp", "avatarmcp.*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
disallow_untyped_calls = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["trimesh.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pygltflib.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "UP", "RUF"]
ignore = ["S104", "S310", "S311", "S314", "S608", "S108", "S603", "S301", "S103", "S112", "S105", "S607", "S701", "S102", "S307", "S324", "ASYNC230", "B008", "B904", "B025", "B019", "B023", "C901", "UP035", "RUF006", "N806", "E501", "F841", "PLW1510", "BLE001", "RUF022", "E402", "F811", "B006", "B007", "RUF059", "RUF001", "RUF002", "S110", "RUF012", "DTZ005", "DTZ006", "DTZ001", "E741", "SIM115", "SIM102", "RUF100", "F401", "D103", "D101", "F821", "TRY002", "S101", "B008", "S106", "S110", "S112", "S101", "B008", "S106", "S110", "S112", "RUF012", "S603", "S607", "S324", "E402", "E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.2",
    "pywin32>=311",
    "ruff>=0.16.0,<0.17",
]
