[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "avatarmcp"
version = "0.1.0"
description = "MCP server for managing and animating VRM avatars"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "AvatarMCP Team", email = "dev@avatarmcp.example.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
    "fastmcp>=2.10.1",
    "numpy>=1.21.0",
    "pygltflib>=1.14.0",
    "trimesh>=3.9.0",
    "pyvista>=0.35.0",
    "typing-extensions>=4.0.0; python_version < '3.10'"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "black>=22.10.0",
    "isort>=5.10.1",
    "mypy>=1.0.0",
    "pylint>=2.15.0",
    "types-setuptools"
]

[project.urls]
Homepage = "https://github.com/yourusername/avatarmcp"
Documentation = "https://github.com/yourusername/avatarmcp#readme"
Issues = "https://github.com/yourusername/avatarmcp/issues"
Source = "https://github.com/yourusername/avatarmcp"

[tool.setuptools.packages.find]
where = ["src"]
include = ["avatarmcp", "avatarmcp.*"]

[tool.black]
line-length = 100
target-version = ['py39']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["avatarmcp"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
disallow_untyped_calls = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["trimesh.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pygltflib.*"]
ignore_missing_imports = true
