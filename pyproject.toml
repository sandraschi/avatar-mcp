[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "avatarmcp"
version = "0.1.0"
description = "MCP server for managing and animating VRM avatars"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "AvatarMCP Team", email = "dev@avatarmcp.example.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
    "fastmcp>=2.14.5",
    "numpy>=1.21.0",
    "python-osc>=1.8.2",
    "pygltflib>=1.14.0",
    "trimesh>=3.9.0",
    "pyvista>=0.35.0",
    "packaging>=21.0",
    "typing-extensions>=4.0.0; python_version < '3.10'",
    "ruff>=0.14.1",
    "fastapi>=0.132.0",
    "uvicorn[standard]>=0.38.0",
    "sounddevice>=0.4.4",
    "prometheus-client>=0.17.1",
    "aiofiles>=23.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pylint>=2.15.0",
    "types-setuptools"
]

[project.scripts]
avatarmcp = "avatarmcp.__main__:main"

[project.entry-points.'mcp.server']
avatarmcp = "avatarmcp.server:AvatarMCPServer"

[project.urls]
Homepage = "https://github.com/yourusername/avatarmcp"
Documentation = "https://github.com/yourusername/avatarmcp#readme"
Issues = "https://github.com/yourusername/avatarmcp/issues"
Source = "https://github.com/yourusername/avatarmcp"

[tool.setuptools.packages.find]
where = ["src"]
include = ["avatarmcp", "avatarmcp.*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E402", # Module level import not at top of file (intentional in some cases)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
disallow_untyped_calls = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["trimesh.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pygltflib.*"]
ignore_missing_imports = true
