name: CI - {{PROJECT_NAME}} Quality Assurance

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  PYTHON_VERSION: '{{MIN_PYTHON_VERSION}}'

jobs:
  quality-assurance:
    name: Quality Assurance
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: {{PYTHON_MATRIX}}
        include:
          - python-version: "{{MIN_PYTHON_VERSION}}"
            coverage: true

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-${{ matrix.python-version }}-
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install ruff mypy pytest pytest-cov pytest-xdist

    - name: Linting and formatting (Ruff)
      run: |
        ruff check {{PACKAGE_NAME}}/ --output-format=github
        ruff format --check {{PACKAGE_NAME}}/

    - name: Type checking (mypy)
      run: |
        mypy {{PACKAGE_NAME}}/ --ignore-missing-imports

    - name: Security scanning (bandit)
      run: |
        pip install bandit
        bandit -r {{PACKAGE_NAME}}/ -f json -o bandit-report.json || true

    - name: Run tests
      run: |
        pytest -v --cov={{PACKAGE_NAME}}/ --cov-report=term-missing --cov-report=xml --cov-report=html --junitxml=test-results.xml

    - name: Build Python package
      run: |
        pip install build
        python -m build

    - name: Validate package
      run: |
        pip install twine
        twine check dist/*

    - name: Upload coverage reports
      if: matrix.coverage
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

    - name: Upload test results
      uses: actions/upload-artifact@v4
      with:
        name: test-results-py${{ matrix.python-version }}
        path: |
          test-results.xml
          coverage.xml
          htmlcov/
          bandit-report.json
        retention-days: 30

  windows-compatibility:
    name: Windows Compatibility
    runs-on: windows-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Basic import test
      run: |
        python -c "import sys; sys.path.insert(0, '{{PACKAGE_NAME}}'); import {{PROJECT_NAME}}; print('✅ Import successful')"

    - name: Run basic tests
      run: |
        pip install pytest
        pytest tests/test_basic.py -v

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Dependency Review
      uses: actions/dependency-review-action@v4
      with:
        config-file: '.github/dependency-review-config.yml'
