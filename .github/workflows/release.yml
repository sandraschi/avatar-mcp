name: Release - AvatarMCP

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (leave empty for auto)'
        required: false
        default: ''
      prerelease:
        description: 'Mark as prerelease'
        type: boolean
        required: false
        default: false

env:
  PYTHON_VERSION: '3.12'

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      upload_url: ${{ steps.create_release.outputs.upload_url }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install uv
      run: pip install uv

    - name: Install dependencies
      run: uv sync --dev

    - name: Determine version
      id: version
      run: |
        if [ "${{ github.event.inputs.version }}" != "" ]; then
          VERSION="${{ github.event.inputs.version }}"
        elif [[ $GITHUB_REF == refs/tags/* ]]; then
          VERSION="${GITHUB_REF#refs/tags/}"
        else
          VERSION="v$(date +%Y.%m.%d)-$(git rev-parse --short HEAD)"
        fi
        PYPI_VERSION="${VERSION#v}"
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "pypi_version=$PYPI_VERSION" >> $GITHUB_OUTPUT
        echo "Release version: $VERSION"

    - name: Build Python package
      run: |
        pip install build
        python -m build
        ls -la dist/

    - name: Validate package
      run: |
        pip install twine
        twine check dist/*

    - name: Create GitHub Release
      id: create_release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.version }}
        name: Release ${{ steps.version.outputs.version }}
        body_path: CHANGELOG.md
        draft: false
        prerelease: ${{ github.event.inputs.prerelease || false }}
        files: |
          dist/*.whl
          dist/*.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: release
    if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, 'alpha') && !contains(github.ref_name, 'beta') && !contains(github.ref_name, 'rc')

    steps:
    - name: Download distributions
      uses: actions/download-artifact@v4
      with:
        name: python-distributions
        path: dist/

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.PYPI_API_TOKEN }}
        packages-dir: dist/

  notify:
    name: Notification
    runs-on: ubuntu-latest
    needs: [release, publish-pypi]
    if: always()

    steps:
    - name: Release notification
      run: |
        if [ "${{ needs.release.result }}" = "success" ]; then
          echo "Release ${{ needs.release.outputs.version }} completed successfully!"
          if [ "${{ needs.publish-pypi.result }}" = "success" ]; then
            echo "Python package published to PyPI"
          fi
        else
          echo "Release failed - check logs above"
          exit 1
        fi
