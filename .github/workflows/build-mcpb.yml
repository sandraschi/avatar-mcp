name: Build MCPB Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (leave empty for auto)'
        required: false
        default: ''
      sign_package:
        description: 'Sign the package (production builds)'
        type: boolean
        required: false
        default: false

env:
  PACKAGE_NAME: avatarmcp
  PYTHON_VERSION: '3.12'

jobs:
  build-mcpb:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install MCPB CLI
      run: npm install -g @anthropic-ai/mcpb

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Validate mcpb.json
      run: mcpb validate mcpb.json

    - name: Build MCPB package
      run: |
        if [ "${{ github.event.inputs.sign_package }}" = "true" ] || [[ $GITHUB_REF == refs/tags/* ]]; then
          echo "Building with signing (production mode)"
          mcpb pack -c mcpb.json -o dist/${{ env.PACKAGE_NAME }}.mcpb
        else
          echo "Building without signing (development mode)"
          mcpb pack -c mcpb.json -o dist/${{ env.PACKAGE_NAME }}.mcpb --no-sign
        fi

    - name: Verify package
      run: |
        ls -la dist/
        mcpb info "dist/${{ env.PACKAGE_NAME }}.mcpb"

    - name: Build Python distribution
      run: |
        python -m pip install build
        python -m build

    - name: Upload MCPB package artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.PACKAGE_NAME }}-mcpb
        path: dist/${{ env.PACKAGE_NAME }}.mcpb
        retention-days: 90

    - name: Upload Python distributions
      uses: actions/upload-artifact@v4
      with:
        name: python-distributions
        path: dist/
        retention-days: 90

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/${{ env.PACKAGE_NAME }}.mcpb
          dist/*.whl
          dist/*.tar.gz
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Publish to PyPI
      if: startsWith(github.ref, 'refs/tags/')
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.PYPI_API_TOKEN }}

    - name: Notify success
      if: success()
      run: |
        echo "MCPB package built successfully!"
        echo "Package: ${{ env.PACKAGE_NAME }}.mcpb"
