server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: avatarmcp
    static_configs:
      - targets:
          - localhost
        labels:
          job: avatarmcp
          __path__: /var/log/avatarmcp/*.log
          environment: development
          service: avatarmcp
    pipeline_stages:
      - json:
          expressions:
            level:
            message:
            name:
            timestamp:
      - labels:
          level:
          name:
      - output:
          source: message
