name: avatarmcp
description: MCP server for managing and animating VRM avatars with comprehensive 3D model support, OSC integration, and real-time animation control
version: "0.1.0"
author: "AvatarMCP Team"
license: "MIT"

# GLAMA platform configuration
glama:
  status: "gold"
  score: 85
  tier: "gold"
  certified: true
  last_updated: "2025-10-11"

# Repository metadata
repository:
  url: "https://github.com/yourusername/avatarmcp"
  type: "mcp-server"
  language: "python"
  framework: "fastmcp"
  platform: "cross-platform"

# Quality metrics
quality:
  code_quality: 9
  testing: 9
  documentation: 9
  infrastructure: 9
  packaging: 10
  mcp_compliance: 9
  total_score: 85

# Tool catalog
tools:
  - name: "initialize"
    category: "core"
    description: "Initialize the AvatarMCP server and scan for VRM models"
  - name: "shutdown"
    category: "core"
    description: "Shutdown the AvatarMCP server"
  - name: "avatar_load"
    category: "avatar"
    description: "Load a VRM avatar model"
  - name: "avatar_unload"
    category: "avatar"
    description: "Unload an avatar model"
  - name: "avatar_list"
    category: "avatar"
    description: "List available/loaded avatars"
  - name: "avatar_set_active"
    category: "avatar"
    description: "Set active avatar"
  - name: "avatar_get_active"
    category: "avatar"
    description: "Get currently active avatar"
  - name: "avatar_get_metadata"
    category: "avatar"
    description: "Get detailed avatar metadata"
  - name: "animation_play"
    category: "animation"
    description: "Play an animation"
  - name: "animation_stop"
    category: "animation"
    description: "Stop current animation"
  - name: "animation_list"
    category: "animation"
    description: "List available animations"
  - name: "parameter_set"
    category: "control"
    description: "Set avatar parameter value"
  - name: "parameter_get"
    category: "control"
    description: "Get avatar parameter value"
  - name: "osc_send"
    category: "osc"
    description: "Send OSC message"
  - name: "osc_receive"
    category: "osc"
    description: "Receive OSC messages"
  - name: "chat_start"
    category: "chat"
    description: "Start chat session"
  - name: "chat_send_message"
    category: "chat"
    description: "Send chat message"
  - name: "chat_stop"
    category: "chat"
    description: "Stop chat session"
  - name: "chat_get_state"
    category: "chat"
    description: "Get chat state"
  - name: "system_status"
    category: "system"
    description: "Get system status"
  - name: "debug_echo"
    category: "debug"
    description: "Echo debug messages"

# Platform features
features:
  - "VRM avatar support"
  - "Real-time animation"
  - "OSC integration"
  - "Cross-platform compatibility"
  - "MCPB packaging"
  - "One-click installation"
  - "Comprehensive API"
  - "Enterprise logging"
  - "Full test coverage"
  - "Professional documentation"

# Compatibility
compatibility:
  python: ">=3.9"
  platforms: ["windows", "macos", "linux"]
  mcp_version: "2.12.0"
  frameworks: ["fastmcp"]

# Keywords for discovery
keywords:
  - "avatar"
  - "vrm"
  - "3d-modeling"
  - "animation"
  - "osc"
  - "mcp-server"
  - "claude-desktop"
  - "virtual-reality"
  - "real-time"
  - "fastmcp"

# Categories
categories:
  - "3d-modeling"
  - "animation"
  - "virtual-reality"
  - "automation"
  - "developer-tools"

# Contact information
contact:
  email: "dev@avatarmcp.example.com"
  repository: "https://github.com/yourusername/avatarmcp"
  documentation: "https://github.com/yourusername/avatarmcp#readme"
  issues: "https://github.com/yourusername/avatarmcp/issues"
